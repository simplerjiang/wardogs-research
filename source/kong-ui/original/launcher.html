<style>

.status{border:1px solid #79303a;border-radius:11px;background:#09060bad;margin-top:20px;padding:13px 15px}.status-head{display:flex;align-items:center;gap:8px}.dot{width:6px;height:6px;border-radius:50%;background:#ff4a42;box-shadow:0 0 11px #ff2525;animation:pulse 2s infinite}.status-head strong{font-size:12px;font-weight:500;letter-spacing:.1em}.status-head small{margin-left:auto;color:#ad7c76;font-size:10px;letter-spacing:.08em}#detail{font-size:12px;line-height:1.7;color:#d7aaa3;margin-top:10px;min-height:40px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:15px 0 0}.step{padding-top:11px;border-top:2px solid #4a232c;color:#855c60;font-size:10px;letter-spacing:.08em;transition:.3s}.step.done{border-color:#ad443f;color:#d1a19a}.step.active{border-color:#ff5649;color:#fff0e7;text-shadow:0 0 14px #ff4545}.step.active:before{content:"";display:inline-block;width:4px;height:4px;background:#ffb3a5;margin-right:5px;animation:pulse 1.2s infinite}.actions{display:flex;gap:10px;margin-top:12px}.actions button{height:38px;flex:1;background:#4c1522;color:#ffc9be;border:1px solid #a23d48;border-radius:8px;font-size:12px}footer{margin-top:17px;display:flex;justify-content:space-between;color:#754850;font-size:9px;letter-spacing:.14em}
[hidden]{display:none!important}.guide-dialog{width:min(580px,calc(100vw - 28px));height:min(620px,calc(100vh - 28px));padding:0;border:1px solid #a12a36;border-radius:16px;background:#16090e;box-shadow:0 0 45px #ff172955}.guide-dialog::backdrop,.confirm-dialog::backdrop{background:#080307b8;backdrop-filter:blur(4px)}.guide-dialog iframe{width:100%;height:100%;border:0;border-radius:15px;background:#16090e}.confirm-dialog{width:min(470px,calc(100vw - 34px));padding:24px;border:1px solid #a12a36;border-radius:16px;background:linear-gradient(145deg,#2b0b14,#12070c);color:var(--text);box-shadow:0 0 45px #ff172955}.confirm-dialog h2{margin:0 0 10px;font-size:16px}.confirm-dialog p{margin:0;color:#d9aba6;font-size:12px;line-height:1.8;white-space:pre-wrap}.confirm-actions{display:flex;gap:9px;margin-top:18px}.confirm-actions button{height:38px;flex:1;border-radius:8px;border:1px solid #813642;background:#4c1522;color:#ffd0c8;font-size:12px}.confirm-actions .confirm{border-color:#ff6d61;background:linear-gradient(110deg,#c7192b,#ef3035);color:#fff4ee}.failed .status{border-color:#ff4b4b}.failed #detail{color:#ffb6a8}
@keyframes enter{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes pulse{50%{opacity:.45;transform:scale(.82)}}@keyframes scan{from{top:0}to{top:100%}}@keyframes shine{0%,55%{transform:translateX(-65%)}75%,100%{transform:translateX(65%)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<style>
.profile-actions{display:flex;gap:9px;margin-top:12px}.profile-actions button{flex:1;height:29px;border:1px solid #6d303b;border-radius:8px;background:#ff252008;color:#d9aaa3;font-size:11px}.profile-actions button:hover{border-color:#ff6d61;color:#fff0ea}footer{margin-top:12px}

<style>

<body>

<main><div class="hero"><svg class="bolt" viewBox="0 0 110 150" aria-hidden="true"><path class="echo" d="M68 4 17 82H49L35 144 96 59H65Z"/><path d="M68 4 17 82H49L35 144 96 59H65Z"/></svg><div class="hero-text"><div class="kicker" data-i18n="kicker">加載成功</div><h1>暴龙王助手</h1><p data-i18n="heroText">助手已就绪 · 正在等待游戏<br>请打开游戏并进入大厅</p></div></div>

    if ((match = text.match(/^免费解绑还要等(.+?)，剩余时间也不够扣时解绑/)))
        return `Free unbind is available in ${englishDuration(match[1])}. This key has insufficient time for paid unbind. Wait or obtain a new key.`;

        return `Free unbind is available in ${englishDuration(match[1])}. Unbinding now deducts ${englishDuration(match[2])} from your key and unbinds the oldest computer. Confirm paid unbind?`;
    if ((match = text.match(/^现在不能免费解绑。继续会扣除(.+?)，/)))
        return `Free unbind is not available yet. Continuing deducts ${englishDuration(match[1])} from your key and unbinds the oldest computer. Confirm paid unbind?`;
    if (text.startsWith('驱动没起来')) return 'The driver could not start. Solution: turn off antivirus, the firewall and Windows Security real-time protection; right-click and run as administrator. Turn off all Core isolation options and restart the computer.';

    if (text.startsWith('绘制模块没有放进')) return 'The rendering component could not load. Restart the latest complete launcher as administrator; the game can remain open.';
    if (text.startsWith('启动失败。')) return 'Startup failed. Send the FATEGEAR diagnostic files from your Desktop to support.';

    if (/不匹配|HWID|mismatch|bound/i.test(text)) return 'This key is bound to a different computer. Use Self-unbind, then log in again.';
    if (/网络|连不上|超时|network|timeout/i.test(text)) return 'Network request failed. Check your connection and try again.';
    if (/停用|封禁|禁用|revok|disabled|suspend/i.test(text)) return 'This key is disabled. Contact support.';
    if (/校验|签名|signature/i.test(text)) return 'Verification failed. Restart the latest launcher and try again.';
    if (/[\u3400-\u9fff]/.test(text)) return 'This step could not complete. Restart the launcher; if it persists, contact support.';
    return text;
}

function applyLanguage(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(n=>n.innerHTML=t(n.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(n=>n.placeholder=t(n.dataset.i18nPlaceholder));byId('eye').textContent=t(byId('license').type==='password'?'show':'hide');byId('close').ariaLabel=t('close');guide.setAttribute('aria-label',t('guideTitle'));guideFrame.title=t('guideTitle');byId('time').textContent=started?byId('time').textContent:t('standby');byId('host').textContent=state.preview?t('previewHost'):t('host');byId('langToggle').textContent=lang==='zh'?'中 / EN':'中文 / EN';paint(state)}
function renderSecurity(mask){const defender=byId('securityDefender'),core=byId('securityCore'),unknown=byId('securityUnknown');defender.hidden=!(mask&1);core.hidden=!(mask&2);unknown.hidden=!(mask&4);if(mask&1){defender.className='security-item warn';defender.textContent=t('securityDefenderOn')}if(mask&2){core.className='security-item warn';core.textContent=t('securityCoreOn')}if(mask&4){unknown.className='security-item warn';unknown.textContent=t('securityUnknown')}}
function paint(s){state=s;document.body.classList.toggle('failed',!!s.failed);const labels=[t('waiting'),t('stepComponent'),t('stepGame'),t('stepConnection'),t('stepMenu'),t('start')],input=byId('license'),securityBlocked=!!s.securityMask,blocked=!!s.busy||!!s.preview||securityBlocked||!!s.updatePhase;byId('status').textContent=s.failed?t('failed'):labels[Math.min(5,s.stage)];byId('detail').textContent=translateNative(s.text);const error=byId('licenseError');error.hidden=!(s.failed&&s.stage===0);error.textContent=error.hidden?'':translateNative(s.text);byId('close').disabled=!!s.busy;byId('start').disabled=blocked;byId('saved').disabled=blocked;byId('clearKey').disabled=blocked;byId('unbind').disabled=blocked;input.disabled=blocked;byId('actions').hidden=!s.failed||s.stage===0;document.querySelectorAll('.step').forEach((node,i)=>{node.classList.toggle('done',i<s.stage);node.classList.toggle('active',i===s.stage)});if(securityBlocked){renderSecurity(s.securityMask);if(!securityDialog.open)securityDialog.showModal()}else if(securityDialog.open)securityDialog.close();if(s.busy&&!started)started=performance.now();if(!s.busy&&!s.failed&&s.stage>0)pendingKey='';if(s.failed&&!s.busy&&!s.preview&&!s.updatePhase){if(pendingKey&&!input.value)input.value=pendingKey;setTimeout(()=>{if(state.failed&&!state.busy&&!state.preview){if(pendingKey&&!input.value)input.value=pendingKey;input.focus({preventScroll:true});input.select()}},0)}if(s.unbindChoice){byId('unbindText').textContent=translateNative(s.text);if(!unbindDialog.open)unbindDialog.showModal()}else if(unbindDialog.open)unbindDialog.close();syncUpdate(s)}
byId('guideOpen').onclick=()=>{guide.showModal();guideFrame.focus()};addEventListener('message',e=>{if(e.source===guideFrame.contentWindow&&e.data==='fg-guide-close')closeGuide()});guide.addEventListener('cancel',e=>{e.preventDefault();closeGuide()});guide.addEventListener('click',e=>{const r=guide.getBoundingClientRect();if(e.target===guide&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))closeGuide()});byId('langToggle').onclick=switchLanguage;
byId('auth').addEventListener('submit',e=>{e.preventDefault();if(state.busy||state.preview)return;const key=byId('license').value.trim();if(key.length<8){byId('detail').textContent=t('shortKey');byId('license').focus();return}if(!host){byId('detail').textContent=t('preview');return}pendingKey=key;paint({...state,busy:true,failed:false,text:t('authBusy'),unbindChoice:0});send('login,'+key)});
byId('saved').onclick=()=>{if(!state.busy&&!state.preview&&host){paint({...state,busy:true,failed:false,text:t('savedBusy'),unbindChoice:0});send('login,')}};
byId('clearKey').onclick=()=>{if(state.busy||state.preview||state.stage!==0)return;byId('license').value='';pendingKey='';send('clear-license');byId('license').focus()};
byId('unbind').onclick=()=>{if(state.busy||state.preview)return;const key=byId('license').value.trim();if(key.length<8){byId('detail').textContent=lang==='en'?'Enter the complete access key before self-unbind.':'请先输入完整卡密，再点自助解绑。';return}paint({...state,busy:true,failed:false,text:lang==='en'?'Checking self-unbind status…':'正在查询解绑状态，请稍候…',unbindChoice:0});send('unbind,'+key)};
byId('unbindConfirm').onclick=()=>{const mode=state.unbindChoice===2?'free':'paid';unbindDialog.close();paint({...state,busy:true,failed:false,text:t('unbindBusy'),unbindChoice:0});send('unbind-confirm,'+mode)};byId('unbindCancel').onclick=()=>{unbindDialog.close();paint({...state,failed:false,unbindChoice:0,text:t('unbindCancelled')})};
byId('securityOpenDefender').onclick=()=>send('security-open-defender');byId('securityOpenCore').onclick=()=>send('security-open-core');byId('securityRecheck').onclick=()=>{if(state.securityMask){paint({...state,busy:true,text:lang==='en'?'Checking security settings…':'正在重新检查系统准备状态…'});send('security-recheck')}};byId('securityClose').onclick=()=>send('close');securityDialog.addEventListener('cancel',e=>{e.preventDefault();send('close')});
byId('eye').onclick=()=>{const input=byId('license');input.type=input.type==='password'?'text':'password';byId('eye').textContent=input.type==='password'?t('show'):t('hide')};byId('close').onclick=byId('dismiss').onclick=()=>send('close');byId('retry').onclick=()=>send('retry');byId('drag').addEventListener('pointerdown',e=>{if(e.button===0&&!e.target.closest('button')){e.preventDefault();send('drag')}});
if(host){host.addEventListener('message',e=>{if(e.data&&typeof e.data.stage==='number'){state=e.data;if(e.data.language==='en'||e.data.language==='zh')lang=e.data.language;applyLanguage()}});send('ready')}else{state={stage:0,busy:false,failed:false,preview:true,unbindChoice:0,securityMask:0,notesSeen:languageStore.getNotes()===CURRENT_RELEASE.version+'.'+CURRENT_RELEASE.build,text:t('preview')};byId('host').textContent=t('previewHost');paint(state)}applyLanguage();setInterval(()=>{byId('time').textContent=started?Math.floor((performance.now()-started)/1000)+'s':t('standby')},1000);
const canvas=byId('lightning'),ctx=canvas.getContext('2d');let last=0,paths=[];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let frame=0;function shape(){const w=innerWidth,h=innerHeight,edge=17,points=[[edge,edge],[w-edge,edge],[w-edge,h-edge],[edge,h-edge],[edge,edge]];let path=[];for(let side=0;side<4;side++){const a=points[side],b=points[side+1],n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/22);for(let i=0;i<n;i++){const q=i/n,noise=(Math.random()-.5)*22;path.push([a[0]+(b[0]-a[0])*q+(side%2?noise:0),a[1]+(b[1]-a[1])*q+(side%2?0:noise)])}}path.push(path[0]);return path}function render(now){if(canvas.width!==innerWidth*devicePixelRatio||canvas.height!==innerHeight*devicePixelRatio){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}ctx.clearRect(0,0,innerWidth,innerHeight);if(!paths.length||now-last>120){paths=[shape()];last=now}for(const path of paths){ctx.beginPath();path.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.strokeStyle='#ff2535';ctx.shadowColor='#ff1729';ctx.shadowBlur=14;ctx.lineWidth=4;ctx.stroke();ctx.shadowBlur=0;ctx.lineWidth=1;ctx.strokeStyle='#fff3e8';ctx.stroke()}if(!reduced&&!document.hidden)frame=requestAnimationFrame(render)}document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(frame);if(!document.hidden)frame=requestAnimationFrame(render)});addEventListener('resize',()=>{paths=[];if(reduced)render(performance.now())});render(0);
</script>
<script>
(function(){
  function syncGuide(){if(typeof guideFrame!=='undefined'&&guideFrame.contentWindow)guideFrame.contentWindow.postMessage({type:'fg-set-language',lang:lang},'*')}
  byId('guideOpen').addEventListener('click',()=>setTimeout(syncGuide,0));
  byId('langToggle').addEventListener('click',()=>setTimeout(syncGuide,0));
  addEventListener('message',e=>{if(e.source===guideFrame.contentWindow&&e.data&&e.data.type==='fg-guide-ready')syncGuide()});
})();
</script>
