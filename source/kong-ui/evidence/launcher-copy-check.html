<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>启动页文案检查</title>
<style>body{margin:24px;background:#20262e;color:#e5edf5;font:14px "Microsoft YaHei UI",sans-serif}button{padding:8px 12px;margin:0 8px 12px 0}iframe{display:block;width:500px;height:300px;border:0}</style>
<button data-case="loading">模拟加载状态</button><button data-case="newline">模拟换行失败</button><button data-case="inline">模拟同一行失败</button><button data-case="english">模拟英文失败</button><button id="language">切换语言</button>
<iframe id="page" src="../launcher.html"></iframe>
<script>
const page=document.getElementById('page');
const messages={loading:'正在加载卡密，请稍候…',newline:'连接失败。\r\n解决：把桌面 FATEGEAR诊断.txt、FATEGEAR状态.txt、FATEGEAR追踪.txt 发回来。',inline:'启动失败。解决：把桌面 FATEGEAR诊断.txt、FATEGEAR状态.txt、FATEGEAR追踪.txt 发回来后再试。',english:'Startup failed. Send the FATEGEAR diagnostic files from your Desktop to support.'};
document.querySelectorAll('[data-case]').forEach(button=>button.onclick=()=>page.contentWindow.paint({stage:button.dataset.case==='loading'?0:2,busy:button.dataset.case==='loading',failed:button.dataset.case!=='loading',preview:false,unbindChoice:0,securityMask:0,text:messages[button.dataset.case]}));
document.getElementById('language').onclick=()=>page.contentWindow.switchLanguage();
</script></html>
